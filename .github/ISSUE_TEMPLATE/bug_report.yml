name: Bug report
description: Report a reproducible correctness or compatibility problem.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use the contact in SECURITY.md. Remove credentials and private code from examples.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the project version or commit, operating system, Node.js and npm versions, and Vite version when applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small input, options or configuration, and the exact command used.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant error output and whether the original and transformed programs produce different results.
    validations:
      required: true
